name: Bug report
description: Something does not work as the README describes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste chat transcripts, credentials or other private information.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - Claude Code
        - Codex Desktop
        - OpenCode
        - Other
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: claude --version, Codex Desktop About window, opencode --version
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Claude Code only - output of /chat-naming status and node --version
      render: text
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26, Ubuntu 24.04, Windows 11
