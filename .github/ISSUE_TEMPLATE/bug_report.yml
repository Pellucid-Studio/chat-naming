name: Bug report
description: Something does not work as the README describes.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste chat transcripts, credentials or other private information.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of /chat-naming status
      render: text
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      placeholder: claude --version
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: node --version
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where the session runs
      options:
        - Terminal (claude CLI)
        - Claude desktop app, Code tab
        - IDE extension
        - SDK or stream-json
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26, Ubuntu 24.04, Windows 11
