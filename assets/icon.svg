<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="38%" cy="30%" r="85%">
      <stop offset="0" stop-color="#1b2150"/>
      <stop offset="0.55" stop-color="#0c0f24"/>
      <stop offset="1" stop-color="#05060d"/>
    </radialGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8ff"/>
      <stop offset="1" stop-color="#b8c4f2"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe2a0"/>
      <stop offset="1" stop-color="#d49a3a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <ellipse cx="530" cy="500" rx="330" ry="250" fill="#6f84ff" opacity="0.28" filter="url(#glow)"/>
  <!-- бирка висит на шнурке, поэтому чуть повёрнута вокруг отверстия -->
  <g transform="translate(16 -10) rotate(8 300 350)">
    <path d="M300 250 H748 a96 96 0 0 1 96 96 V598 a96 96 0 0 1 -96 96 H430 L300 802 L322 694 H300 a96 96 0 0 1 -96 -96 V346 a96 96 0 0 1 96 -96 Z" fill="url(#bubble)"/>
    <circle cx="300" cy="350" r="34" fill="#0c0f24"/>
    <rect x="384" y="410" width="372" height="58" rx="29" fill="#141a3e"/>
    <circle cx="413" cy="550" r="27" fill="url(#gold)"/>
    <rect x="470" y="530" width="232" height="40" rx="20" fill="#5a67a8"/>
  </g>
  <!-- шнурок уходит в отверстие, кольцо поверх его конца -->
  <path d="M316 334 C296 250 250 196 176 166" fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="316" cy="340" r="34" fill="none" stroke="url(#gold)" stroke-width="14"/>
</svg>
